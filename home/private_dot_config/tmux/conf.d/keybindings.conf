# ==========================================
# Keybindings: Pane/Window Control & Navigation
# ==========================================

# Smart pane switching with awareness of Vim splits.
# Allows seamless navigation between tmux panes and Vim splits using Ctrl + h/j/k/l.
# If you don't use vim-tmux-navigator plugin, you can still use Prefix + h/j/k/l to switch panes.
# Here we define prefix-based vim-like pane navigation:
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fine-grained pane resizing using Prefix + shift + H/J/K/L
# The '-r' flag makes these keys repeatable (you don't have to press Prefix every time)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (maximize active pane)
# Great for temporarily focusing on a specific pane's output
bind f resize-pane -Z

# Switch windows using Alt + Arrow keys without prefix
# Useful for quick navigation across windows
bind -n M-Left previous-window
bind -n M-Right next-window

# Create new window in the current pane's directory
bind c new-window -c "#{pane_current_path}"
