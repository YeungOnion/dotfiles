# ==========================================
# General Settings & Sensible Defaults
# ==========================================

# Increase scrollback buffer size (default is 2000)
# This is great for viewing long build outputs or logs
set -g history-limit 50000

# Address vim mode switching delay
# See: http://superuser.com/a/252717/65504
# Reduces delay when pressing Esc in Vim inside tmux
set -s escape-time 0

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often (default 15s)
set -g status-interval 5

# Super useful: Start window and pane numbering at 1 instead of 0
# This makes switching windows using keyboard numbers (Prefix + 1, 2, etc.) much more ergonomic
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
# Keeps your window list ordered (1, 2, 3...) without gaps
set -g renumber-windows on

# Enable focus events for terminals that support them
# Allows applications like Vim running inside tmux to detect when they gain/lose focus
set -g focus-events on

# Enable 256 colors and true color (RGB) support if supported by terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Increase repeat time for repeatable bindings (e.g. pane resizing)
# Allows hitting key multiple times within 600ms without pressing prefix again
set -g repeat-time 600
