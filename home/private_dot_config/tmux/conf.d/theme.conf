# =====================================================================
# Theme: palette from the terminal_theme target (fish, ~/.local/state/terminal-theme)
# =====================================================================

# Applies the target on server start and on every reload (prefix r); change it
# with `terminal_theme light|dark|toggle`, which recolors a running server itself.
run-shell 'fish -c "terminal_theme apply"'

# =====================================================================
# Theme Configuration Layout (Common)
# =====================================================================

# Status bar general colors
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Status bar left side
set -g status-left-length 30
set -g status-left "#[fg=#{@thm_crust},bg=#{@thm_green},bold] ❐ #S #[bg=default,fg=default] "

# Status bar right side (with indicator)
set -g status-right-length 100
set -g status-right "#(~/.config/tmux/scripts/bridge-status.sh #{session_name})#[fg=#{@thm_blue}] %H:%M #[fg=#{@thm_overlay}]•#[fg=#{@thm_fg}] %d-%b-%y #[fg=#{@thm_pink},bg=#{@thm_surface},bold] #H#{@host_marker} "

# Window status tabs
setw -g window-status-separator " "
setw -g window-status-style "fg=#{@thm_overlay},bg=#{@thm_surface}"
setw -g window-status-format " #I: #W "

# Active window
setw -g window-status-current-style "fg=#{@thm_crust},bg=#{@thm_blue},bold"
setw -g window-status-current-format " #I: #W "

# Window that rang the bell (a Claude session waiting for input)
setw -g window-status-bell-style "fg=#{@thm_crust},bg=#{@thm_pink},bold"

# Borders
set -g pane-border-style "fg=#{@thm_surface}"
set -g pane-active-border-style "fg=#{@thm_blue}"

# Message Bar
set -g message-style "bg=#{@thm_surface},fg=#{@thm_green},bold"
