# ==========================================
# Copy Mode (Vim-like text selection and copy)
# ==========================================

# Use Vim keybindings in copy mode (Prefix + [)
# Makes copying text in terminal feel natural to Vim users
setw -g mode-keys vi

# Bindings for selection and copying in copy-mode
# Press Prefix + [ to enter copy-mode, then:
# 'v' starts selection (just like visual mode in Vim)
# 'y' copies selection and exits copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Drag-to-copy selection with mouse does not auto-cancel copy mode (keeps scroll position)
unbind -T copy-mode-vi MouseDragEnd1Pane
