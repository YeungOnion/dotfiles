# =====================================================================
# Main Tmux Configuration File
# =====================================================================

# --- Core Prefixes & Splitting ---
# (Maintained from your original minimal config)

# c-a prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# hot reload
bind r source-file ~/.config/tmux/tmux.conf

# mouse for ez
set -g mouse on


# =====================================================================
# Modular Configurations (Uncomment/comment to easily enable/disable)
# =====================================================================

# 1. Sensible Defaults & Performance Settings
source-file ~/.config/tmux/conf.d/settings.conf

# 2. Enhanced Vim-like Keybindings & Pane Navigation
source-file ~/.config/tmux/conf.d/keybindings.conf

# 3. Vim-like Copy Mode (Selection & Clipboard)
source-file ~/.config/tmux/conf.d/copymode.conf

# 4. Modern & Elegant Status Bar / Theme
source-file ~/.config/tmux/conf.d/theme.conf
