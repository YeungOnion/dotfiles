# Installed to /etc/keyd/default.conf by .chezmoiscripts/run_after_08-keyd.sh.tmpl.
# Caps Lock: Ctrl while held or chorded, Esc when tapped.
[global]
# A tap longer than this many ms sends nothing (instead of a stray Esc). Raise it if slow
# taps get missed, lower it if quick chords send an Esc.
overload_tap_timeout = 200

[ids]
*

[main]
capslock = overload(control, esc)
