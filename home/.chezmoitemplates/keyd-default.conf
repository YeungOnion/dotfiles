# Installed to /etc/keyd/default.conf by .chezmoiscripts/run_after_08-keyd.sh.tmpl.
# Caps Lock: Ctrl while held or chorded, Esc when tapped.
# Use overload(), not overloadt(layer, action, ms): overloadt only activates the layer after
# the key has been held that long, so a fast chord (Caps+C) loses its Ctrl.
# keyd has no offline config check; the daemon reports parse errors on reload
# (journalctl -u keyd). Verify behavior with `sudo keyd.rvaiya monitor`.
[global]
# A tap longer than this many ms sends nothing (instead of a stray Esc). 0 disables the
# timeout. Raise it if slow taps get missed, lower it if quick chords send an Esc.
overload_tap_timeout = 200

[ids]
*

[main]
capslock = overload(control, esc)
