# Bind 'y' to toggle the bottom pane between 15% and 0% (hiding it)
bind y if-shell "tmux list-panes -F '#{pane_height}' | grep -q '^1$'" \
    "resize-pane -t 1 -y 15%" \
    "resize-pane -t 1 -y 0"

# Initial setup script (run once to create the layout)
# Usage: tmux new-session -d -s work; tmux send-keys 'hx .' C-m; tmux split-window -v -p 15; tmux attach -t work
