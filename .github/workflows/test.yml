name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish + chezmoi
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Init chezmoi (generates config from .chezmoi.toml.tmpl)
        run: chezmoi init --source=$GITHUB_WORKSPACE

      - name: Apply dotfiles
        run: chezmoi apply --exclude=scripts

      - name: Install fisher + plugins
        run: chezmoi apply --include=scripts --source-path $GITHUB_WORKSPACE/home/.chezmoiscripts/run_onchange_install-packages.sh.tmpl

      - name: Run tests
        run: make test
