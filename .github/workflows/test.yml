name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHEZMOI_SOURCE: ${{ github.workspace }}/home
    steps:
      - uses: actions/checkout@v4

      - name: Install fish + chezmoi
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Init chezmoi (generates config from .chezmoi.toml.tmpl)
        run: |
          chezmoi init --source=$GITHUB_WORKSPACE
          ln -s $GITHUB_WORKSPACE/home ~/.local/share/chezmoi

      - name: Apply dotfiles
        run: make apply-dotfiles

      - name: Install fisher + plugins
        run: make apply-packages

      - name: Run tests
        run: make test
